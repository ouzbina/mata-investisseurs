databases:
  - name: mata-investisseurs-db
    plan: free
    databaseName: mata_investisseurs
    user: mata_investisseurs

services:
  - type: web
    name: mata-investisseurs
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mata-investisseurs-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
